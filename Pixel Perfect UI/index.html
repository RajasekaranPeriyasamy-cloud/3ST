<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>3ST Algo Desk — Kite Control Panel</title>
    <meta
      name="description"
      content="Algo trading control panel for Zerodha Kite Connect. 3ST (Triple HA SuperTrend + ADX) strategy with backtest and live desk."
    />
    <meta name="author" content="3ST Algo Desk" />
    <meta property="og:title" content="3ST Algo Desk" />
    <meta
      property="og:description"
      content="Kite Connect algo trading control panel with 3ST strategy."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />
    <!--
      Gamma Density desk only (see src/styles/gamma-desk.css). Editorial serif for
      display, industrial grotesque for UI, IBM Plex Mono for figures — Plex has
      genuinely better digit legibility than JetBrains at 10–11px, which is the
      size most of this desk reads at. `display=swap` so a slow or absent network
      degrades to the existing stack instead of blocking a live desk.
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap"
    />

    <!--
      Mirrors THEME_BOOT_SCRIPT in src/lib/theme.ts — keep the two in sync.
      Must run before paint, so it is inlined rather than imported. `class="dark"`
      above is the default; this only downgrades to light when that is the stored
      preference.
    -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("3st-theme");
          var d = t !== "light";
          document.documentElement.classList.toggle("dark", d);
          document.documentElement.style.colorScheme = d ? "dark" : "light";
        } catch (e) {
          document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

name: CI

# 3ST places real orders with real money — this workflow exists so a broken
# import or a regression like the watchlist_activation UnboundLocalError
# (execution/watchlist_activation.py, fixed 2026-07-25 — see
# tests/test_watchlist_activation.py) gets caught on every push instead of
# only when someone happens to click the button live.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v

  typecheck:
    runs-on: ubuntu-latest
    # Blocking, unlike `lint` below, and the difference is deliberate: ruff has a
    # pre-existing backlog to grandfather in, `tsc --noEmit` has none. It went
    # from 23 errors to 0 on 2026-08-31 and this job exists to keep it there.
    #
    # Nothing else in the repo looks at these. `vite build` does not typecheck —
    # it transpiles and strips types — so the frontend was effectively unchecked
    # and the 23 accumulated unseen. Two of them were live defects, not notation:
    # the execution taskbar read `next_exit.label`, a key the exit-ladder rows
    # never carry, and so labelled an exit price with the wrong rung's name.
    defaults:
      run:
        working-directory: "Pixel Perfect UI"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          # Relative to the repo root, not to working-directory above.
          cache-dependency-path: "Pixel Perfect UI/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

  lint:
    runs-on: ubuntu-latest
    # Non-blocking for now: the codebase predates this workflow and has a
    # backlog of style-only findings (`ruff check .` — see pyproject.toml
    # for the enabled rule set). Flip this to a hard gate once that backlog
    # is cleared so new violations don't creep back in silently.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check .
